[package]
name = "VP429"
version = "0.1.0"
edition = "2021"
default-run = "VP429-web"
description = "VP429 — Dual-Edition VPN (Tauri v2 React Web Edition + Pure Rust GPUI Lite Edition)"

[features]
default = ["web"]
web = ["dep:tauri", "dep:tauri-build"]
lite = ["dep:gpui", "dep:winresource"]

[[bin]]
name = "VP429-web"
path = "src/bin/vp429_web.rs"
required-features = ["web"]

[[bin]]
name = "VP429-lite"
path = "src/bin/vp429_lite.rs"
required-features = ["lite"]

[dependencies]
tauri = { version = "2", features = [], optional = true }
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"], optional = true }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
directories = "5"
anyhow = "1"
chrono = "0.4"
dashmap = "6"
rand = "0.8"
urlencoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinInet",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", optional = true }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
